[package]
name = "open-dsh"
version = "0.1.0"
description = "Tauri 2 shell that boots dsh web, streams its logs, and lives in the tray"
authors = ["open-dsh"]
edition = "2021"

[lib]
name = "open_dsh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
