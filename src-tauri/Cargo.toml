[package]
name = "dsh-launcher"
version = "0.1.2"
description = "Tauri 2 shell that boots dsh web, streams its logs, and lives in the tray"
authors = ["DSH Launcher"]
edition = "2021"
license = "MIT"

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
