<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="stage" style="--i: 0">
        <h1 class="wordmark">DSH Launcher</h1>

        <p id="status" class="status" role="status">waiting…</p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
